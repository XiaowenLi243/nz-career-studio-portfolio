<script>
const $=s=>document.querySelector(s);const jobs=[{id:1,title:'Research Programmer',company:'示例大学 · 统计研究团队',place:'Auckland',date:'11 月 22 日',sort:1,status:'准备材料',field:'研究软件',saved:true,next:'补充 R / Shiny 项目经历',fit:'统计建模、Python / R 与 GTA 教学经验',gap:'核实 Shiny、测试与部署经验',phd:'授位要求待核实',checks:[false,false,false]},{id:2,title:'Bioinformatics Analyst',company:'示例基因组研究机构',place:'Auckland',date:'12 月 02 日',sort:2,status:'感兴趣',field:'生物信息学',saved:true,next:'确认是否接受待授位申请人',fit:'多组学、疾病相关深度学习与统计研究',gap:'补充岗位所需分析流程的具体证据',phd:'是否要求正式授位待确认',checks:[false,false,false]},{id:3,title:'AI Product Associate',company:'示例产品团队',place:'Remote NZ',date:'日期待确认',sort:3,status:'待判断',field:'AI 产品',saved:false,next:'准备一个真实产品探索案例',fit:'AI 工具实践、问题分析与原型探索',gap:'正式产品团队工作经历待补充',phd:'演示设定：不要求',checks:[false,false,false]},{id:4,title:'Machine Learning Scientist',company:'示例医学数据团队',place:'Wellington',date:'日期待确认',sort:4,status:'已申请',field:'医学机器学习',saved:false,next:'演示任务：等待招聘方回复',fit:'疾病预测、统计建模与 Python / R / SAS',gap:'临床模型部署经验待补充',phd:'授位要求待核实',checks:[true,true,false]}];let view='all',filter='all',selected=new Set(),opened=null,detailWidth=420;let toastTimer;
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2500)}
function render(){let q=$('#search').value.toLowerCase();let a=jobs.filter(j=>(view!=='saved'||j.saved)&&(view!=='applied'||j.status==='已申请')&&(view!=='closed')&&(filter!=='preparing'||j.status==='准备材料')&&(filter!=='auckland'||j.place==='Auckland')&&(view!=='deadline'||j.status!=='已申请')&&(`${j.title} ${j.company}`.toLowerCase().includes(q))).sort((a,b)=>a.sort-b.sort);$('#list').innerHTML=a.length?a.map(j=>`<article class="job ${opened===j.id?'selected':''}" tabindex="0" role="button" aria-label="查看 ${j.title}" data-id="${j.id}"><input type="checkbox" data-select="${j.id}" aria-label="选择 ${j.title}" ${selected.has(j.id)?'checked':''}><div class="jobbody"><div class="jobtitle">${j.title}</div><div class="company">${j.company} · ${j.place}</div><div class="tags"><span class="tag">${j.status}</span><span class="tag neutral">${j.field}</span></div><div class="next">下一步 · ${j.next}</div></div><div class="jobright"><span class="deadline">${j.date}</span><small>演示日期</small><button class="star ${j.saved?'saved':''}" data-star="${j.id}" aria-label="${j.saved?'取消收藏':'收藏'} ${j.title}" aria-pressed="${j.saved}">${j.saved?'★':'☆'}</button></div></article>`).join(''):'<div class="empty">这里暂时没有演示岗位。<br>可以切换分类，或清除搜索与筛选。</div>';$('#savedcount').textContent=jobs.filter(j=>j.saved).length;$('#selectedcount').textContent=`已选 ${selected.size} 个岗位`;$('#floating').classList.toggle('visible',selected.size>0)}
function openDetail(id){opened=id;const j=jobs.find(j=>j.id===id);$('#detail').innerHTML=`<div class="detailtop">OPPORTUNITY / 0${j.id}<button class="iconbtn" id="closedetail" aria-label="关闭岗位详情"><svg><use href="#x"/></svg></button></div><h2>${j.title}</h2><p class="company">${j.company} · ${j.place}</p><div class="tags"><span class="tag">${j.field}</span><span class="tag neutral">演示数据</span></div><section class="detailsection"><label>匹配优势</label><p>${j.fit}</p></section><section class="detailsection"><label>需要确认</label><p>${j.gap}<br>${j.phd}</p></section><section class="detailsection"><label>材料清单 <span id="checkcount"></span></label><div class="checks">${['针对岗位的 CV','Cover Letter','研究 / 项目摘要'].map((v,i)=>`<label><input type="checkbox" data-check="${i}" ${j.checks[i]?'checked':''}>${v}</label>`).join('')}</div></section><button class="primary" id="start">${j.status==='准备材料'?'准备中 · 已记录':j.status==='已申请'?'已申请 · 演示状态':'开始准备材料 →'}</button><p class="muted" style="font-size:10px;margin-top:12px">桌面宽屏可拖动左侧细线调整宽度。</p>`;$('#workspace').classList.add('detail-open');$('#detailwrap').setAttribute('aria-hidden','false');$('#detailwrap').inert=false;$('#closedetail').onclick=closeDetail;$('#start').onclick=()=>{if(j.status==='已申请'){toast('这是演示的已申请记录');return}j.status='准备材料';openDetail(id);toast('已移入准备材料 · 仅本次演示')};$('#detail').onchange=e=>{if(e.target.matches('[data-check]')){j.checks[Number(e.target.dataset.check)]=e.target.checked;checkCount(j)}};checkCount(j);render();$('#closedetail').focus({preventScroll:true})}

$('#collapse').onclick=()=>{document.body.classList.toggle('collapsed');let c=document.body.classList.contains('collapsed');$('#collapse').setAttribute('aria-label',c?'展开侧栏':'收起侧栏');$('#collapse').setAttribute('aria-expanded',!c);$('#collapse span').textContent=c?'展开侧栏':'收起侧栏'};
$('.nav').onclick=e=>{let b=e.target.closest('[data-view]');if(!b)return;view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(n=>n.classList.toggle('active',n===b));$('#heading').textContent={all:'给下一步，多一点空间。',saved:'把注意力，留给感兴趣的机会。',applied:'已出发，等待下一次回应。',closed:'结束的记录，也有自己的位置。',deadline:'按截止日期，安排下一步。'}[view];closeDetail()};
$('.tabs').onclick=e=>{let b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(n=>n.classList.toggle('active',n===b));render()};$('#search').oninput=render;$('#list').onclick=e=>{if(e.target.matches('[data-select]')){let id=Number(e.target.dataset.select);e.target.checked?selected.add(id):selected.delete(id);render();return}const star=e.target.closest('[data-star]');if(star){const j=jobs.find(j=>j.id===Number(star.dataset.star));j.saved=!j.saved;render();toast(j.saved?'已收藏到感兴趣':'已取消收藏');return}let row=e.target.closest('[data-id]');if(row)openDetail(Number(row.dataset.id))};$('#list').onkeydown=e=>{if(e.target.matches('.job')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openDetail(Number(e.target.dataset.id))}};$('#scrim').onclick=closeDetail;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#comparison').open)closeDetail()});$('#clear').onclick=()=>{selected.clear();render()};$('#bulkstar').onclick=()=>{jobs.filter(j=>selected.has(j.id)).forEach(j=>j.saved=true);selected.clear();render();toast('所选岗位已加入感兴趣')};$('#compare').onclick=()=>{if(selected.size<2){toast('请先勾选至少两个岗位');return}const a=jobs.filter(j=>selected.has(j.id));$('#comparebody').innerHTML=`<table><thead><tr><th>比较维度</th>${a.map(j=>`<th>${j.title}</th>`).join('')}</tr></thead><tbody>${[['company','公司'],['place','地点'],['date','演示截止日期'],['fit','匹配优势'],['gap','待补充'],['phd','博士要求'],['next','下一步']].map(([k,l])=>`<tr><td>${l}</td>${a.map(j=>`<td>${j[k]}</td>`).join('')}</tr>`).join('')}</tbody></table>`;$('#comparison').showModal()};$('#closecompare').onclick=()=>$('#comparison').close();$('#help').onclick=()=>toast('试试：收起侧栏 → 点岗位 → 勾选两项比较');
const resize=$('#resize');resize.onpointerdown=e=>{if(e.button!==0)return;resize.setPointerCapture(e.pointerId);document.body.classList.add('dragging')};resize.onpointermove=e=>{if(!resize.hasPointerCapture(e.pointerId))return;detailWidth=Math.max(320,Math.min(580,window.innerWidth-e.clientX-38));document.documentElement.style.setProperty('--detail',detailWidth+'px')};const endDrag=()=>document.body.classList.remove('dragging');resize.onpointerup=endDrag;resize.onlostpointercapture=endDrag;resize.onpointercancel=endDrag;resize.onkeydown=e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();detailWidth=Math.max(320,Math.min(580,detailWidth+(e.key==='ArrowLeft'?20:-20)));document.documentElement.style.setProperty('--detail',detailWidth+'px')};$('#detailwrap').inert=true;render();
</script></body></html>
